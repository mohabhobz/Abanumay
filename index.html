<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام منح أبانمي</title>
    <meta name="description" content="بروتوتايب واجهة نظام إدارة المنح — مؤسسة سليمان أبانمي الأهلية" />

    <!-- أيقونة التاب: الشعار على بلاطة بلون المؤسسة.
         الشجرة بتفاصيلها بتتلخبط عند ١٦ بكسل، والبلاطة بتديها سيلويت
         مصمت بيتشاف على شريط التابات الفاتح والغامق. الـ.ico قبل الـsvg:
         المتصفحات القديمة بتاخد الأول اللي تعرفه، والحديثة بتفضّل الـsvg. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#144547" />

    <!-- المظهر قبل أول رسمة: من غير ده الصفحة بتترسم فاتحة وبعدين
         تقلب داكنة بعد ما ريآكت يشتغل — ومضة في وش المستخدم.
         نفس المفتاح والقيم اللي في src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('ab-theme')
        document.documentElement.setAttribute(
          'data-theme',
          t === 'dark' || t === 'green' ? t : 'light'
        )
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>

    <!-- خط الهوية «براندو ارابيك» ترخيصه تجاري ولسه ما وصلش، فالبديل
         المؤقت هو Cairo. لما ملفات براندو توصل، الـ@font-face في
         index.css بيتفعّل والسطر ده بيتشال — مفيش اسم خط تاني في
         السيستم كله عشان الشاشة تطلع نفسها على كل جهاز.
         IBM Plex Mono اتشال: كان خطًّا رابعًا برّه الهوية للأكواد. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
